<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <title>Cart</title>
  </head>
  <body>
    <div class="container mt-4">
      <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
        <a class="navbar-brand" href="final.html">Home</a>
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="product.html">Products</a></li>
          <li class="nav-item active"><a class="nav-link" href="cart.html">Cart</a></li>
        </ul>
      </nav>

      <h3>Items in Cart: <span id="cartCount">0</span></h3>

      <!-- CART FORM -->
      <form class="border p-3 rounded mt-4">

        <h4 class="mb-3">Your Cart</h4>

        <!-- Item list -->
        <div id="cartItems"></div>

        <hr>

        <!-- Price summary -->
        <div class="form-group">
          <label>Subtotal:</label>
          <input type="text" id="subtotal" class="form-control" readonly>
        </div>

        <div class="form-group">
          <label>Tax (12.5%):</label>
          <input type="text" id="tax" class="form-control" readonly>
        </div>

        <div class="form-group">
          <label><strong>Total:</strong></label>
          <input type="text" id="total" class="form-control font-weight-bold" readonly>
        </div>

      </form>

      <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    </div>

    <script>
      // Show cart count
      document.getElementById("cartCount").innerText =
        localStorage.getItem("cartCount") || 0;

      // Read item from URL
      const params = new URLSearchParams(window.location.search);
      const item = params.get("item");

      // Price list
      const prices = {
        "Chocolate Chip Cookie": 2.50,
        "Blueberry Muffin": 3.00,
        "Donut": 2.00,
        "Brownies": 2.50,
        "Chocolate Cake": 10.00,
        "Cinnamon Rolls": 4.00
      };

      let subtotal = 0;
      if (item) {
        const price = prices[item] || 0;
        subtotal += price;

        document.getElementById("cartItems").innerHTML = `
          <div class="form-group">
            <label>Item:</label>
            <input type="text" class="form-control" value="${item}" readonly>
          </div>
          <div class="form-group">
            <label>Price:</label>
            <input type="text" class="form-control" value="$${price.toFixed(2)}" readonly>
          </div>
        `;
      }
      const tax = subtotal * 0.125;
      const total = subtotal + tax;
      document.getElementById("subtotal").value = `$${subtotal.toFixed(2)}`;
      document.getElementById("tax").value = `$${tax.toFixed(2)}`;
      document.getElementById("total").value = `$${total.toFixed(2)}`;
    </script>

  </body>
</html>

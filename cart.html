<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <title>Cart</title>
    <style>
    body {
      background: #fff8f2;
      font-family: "Poppins", sans-serif;
      color: #4a3f35;
    }

    .navbar {
      background: #ffe8d6 !important;
      border-radius: 10px;
      margin-top: 15px;
    }

    .navbar-brand,
    .nav-link {
      font-weight: 600;
      color: #5a4634 !important;
    }

    .nav-link:hover {
      color: #c97b4e !important;
    }

    h3, h4 {
      font-weight: 700;
      color: #5a4634;
    }

    form {
      background: #ffe8d6;
      border-radius: 12px;
    }

    #cartItems .border {
      background: #fff;
      border: 2px solid #f3d7c3;
      border-radius: 10px !important;
    }

    .btn-danger {
      background-color: #c97b4e;
      border: none;
    }

    .btn-danger:hover {
      background-color: #a85f3a;
    }

    input.form-control {
      background: #fffdf9;
      border: 1px solid #d8c1b0;
    }

    input.form-control[readonly] {
      font-weight: 600;
    }
 </style>

  </head>

  <body>
    <div class="container mt-4">

      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand active" href="index.html">Home</a>

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="product.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="cart.html">Cart</a>
            </li>
          </ul>
        </div>
      </nav>

      <h3>Items in Cart: <span id="cartCount">0</span></h3>

      <form class="border p-3 rounded mt-4">
        <h4>Your Cart</h4>

        <div id="cartItems"></div>

        <hr>

        <div class="form-group">
          <label>Subtotal:</label>
          <input type="text" id="subtotal" class="form-control" readonly>
        </div>

        <div class="form-group">
          <label>Tax (12.5%):</label>
          <input type="text" id="tax" class="form-control" readonly>
        </div>

        <div class="form-group">
          <label><b>Total:</b></label>
          <input type="text" id="total" class="form-control font-weight-bold" readonly>
        </div>
      </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
     // price list
      const prices = {
        "Chocolate Chip Cookie": 2.50,
        "Blueberry Muffin": 3.00,
        "Donut": 2.00,
        "Brownies": 3.00,
        "Chocolate Cake": 6.00,
        "Cinnamon Rolls": 4.00
      };

      // JSOn.parse turns it into an array, local storage stores information even when the page is refreshed
      let items = JSON.parse(localStorage.getItem("cartItems")) || [];

      // update cart count
      document.getElementById("cartCount").innerText = items.length;

      let subtotal = 0;
      const cartItemsDiv = document.getElementById("cartItems");

      // empty cart message
      if (items.length === 0) {
        cartItemsDiv.innerHTML = `<p>Your cart is empty.</p>`;
      } else {
        // show each item
        items.forEach((itemName, index) => {

          // item price
          const price = prices[itemName] || 0;

          // add to subtotal
          subtotal += price;

          // add item block
          cartItemsDiv.innerHTML += `
            <div class="border rounded p-2 mb-3">
              <div class="form-group">
                <label>Item ${index + 1}:</label>
                <input type="text" class="form-control" value="${itemName}" readonly>
              </div>

              <div class="form-group">
                <label>Price:</label>
                <input type="text" class="form-control" value="$${price.toFixed(2)}" readonly>
              </div>

              <!-- remove button -->
              <button type="button" class="btn btn-danger" onclick="removeItem(${index})">Remove Item</button>
            </div>
          `;
        });
      }

      // tax + total
      const tax = subtotal * 0.125;
      const total = subtotal + tax;

      // show totals
      document.getElementById("subtotal").value = `$${subtotal.toFixed(2)}`;
      document.getElementById("tax").value = `$${tax.toFixed(2)}`;
      document.getElementById("total").value = `$${total.toFixed(2)}`;

      // remove item function
      function removeItem(index) {
        // get cart again
        let items = JSON.parse(localStorage.getItem("cartItems")) || [];

        // remove item
        items.splice(index, 1);

        // save updated cart
        localStorage.setItem("cartItems", JSON.stringify(items));

        // refresh page
        window.location.reload();
      }

    </script>

  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <title>Cart</title>
  </head>
  <body>
    <div class="container mt-4">
      <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
        <a class="navbar-brand" href="final.html">Home</a>
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="product.html">Products</a></li>
          <li class="nav-item active"><a class="nav-link" href="cart.html">Cart</a></li>
        </ul>
      </nav>

      <h3>Items in Cart: <span id="cartCount">0</span></h3>

      <h4 class="mt-4">Items Added:</h4>
      <ul id="cartItems" class="list-group mb-4"></ul>

      <h4>Subtotal: $<span id="subtotal">0.00</span></h4>
      <h4>Tax (12.5%): $<span id="tax">0.00</span></h4>
      <h3>Total: $<span id="total">0.00</span></h3>

      <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    </div>

    <script>
      // Show cart count
      document.getElementById("cartCount").innerText =
        localStorage.getItem("cartCount") || 0;

      // Read item from URL
      const params = new URLSearchParams(window.location.search);
      const item = params.get("item");

      const prices = {
        "Chocolate Chip Cookie": 2.50,
        "Blueberry Muffin": 3.00,
        "Donut": 1.75,
        "Brownies": 2.50,
        "Chocolate Cake": 10.00,
        "Cinnamon Rolls": 4.00
      };

      let subtotal = 0;

      if (item) {
        const list = document.getElementById("cartItems");
        const li = document.createElement("li");
        li.className = "list-group-item";

        const price = prices[item] || 0;
        subtotal += price;

        li.textContent = `${item} - $${price.toFixed(2)}`;
        list.appendChild(li);
      }
      const tax = subtotal * 0.125;
      const total = subtotal + tax;
      document.getElementById("subtotal").innerText = subtotal.toFixed(2);
      document.getElementById("tax").innerText = tax.toFixed(2);
      document.getElementById("total").innerText = total.toFixed(2);
    </script>

  </body>
</html>

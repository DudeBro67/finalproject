<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <title>Cart</title>
  </head>

  <body>
    <div class="container mt-4">

      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand active" href="index.html">Home</a>

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="product.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="cart.html">Cart</a>
            </li>
          </ul>
        </div>
      </nav>

      <h3>Items in Cart: <span id="cartCount">0</span></h3>

      <form class="border p-3 rounded mt-4">
        <h4>Your Cart</h4>

        <div id="cartItems"></div>

        <hr>

        <div class="form-group">
          <label>Subtotal:</label>
          <input type="text" id="subtotal" class="form-control" readonly>
        </div>

        <div class="form-group">
          <label>Tax (12.5%):</label>
          <input type="text" id="tax" class="form-control" readonly>
        </div>

        <div class="form-group">
          <label><strong>Total:</strong></label>
          <input type="text" id="total" class="form-control font-weight-bold" readonly>
        </div>
      </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
     const prices = {
      "Chocolate Chip Cookie": 2.50,
      "Blueberry Muffin": 3.00,
      "Donut": 2.00,
      "Brownies": 3.00,
      "Chocolate Cake": 6.00,
      "Cinnamon Rolls": 4.00
    };

      let items = JSON.parse(localStorage.getItem("cartItems")) || [];
      document.getElementById("cartCount").innerText = items.length;

      let subtotal = 0;
      const cartItemsDiv = document.getElementById("cartItems");

      if (items.length === 0) {
        cartItemsDiv.innerHTML = `<p>Your cart is empty.</p>`;
      } else {
        items.forEach((itemName, index) => {
          const price = prices[itemName] || 0;
          subtotal += price;

          cartItemsDiv.innerHTML += `
            <div class="border rounded p-2 mb-3">
              <div class="form-group">
                <label>Item ${index + 1}:</label>
                <input type="text" class="form-control" value="${itemName}" readonly>
              </div>

              <div class="form-group">
                <label>Price:</label>
                <input type="text" class="form-control" value="$${price.toFixed(2)}" readonly>
              </div>

              <button type="button" class="btn btn-danger" onclick="removeItem(${index})">Remove Item</button>
            </div>
          `;
        });
      }

      const tax = subtotal * 0.125;
      const total = subtotal + tax;

      document.getElementById("subtotal").value = `$${subtotal.toFixed(2)}`;
      document.getElementById("tax").value = `$${tax.toFixed(2)}`;
      document.getElementById("total").value = `$${total.toFixed(2)}`;

      function removeItem(index) {
        let items = JSON.parse(localStorage.getItem("cartItems")) || [];
        items.splice(index, 1);
        localStorage.setItem("cartItems", JSON.stringify(items));
        window.location.reload();
      }
    </script>

  </body>
</html>
